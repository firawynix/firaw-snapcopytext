<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firaw SnapCopyText</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="logo">◎</div><div><strong>Firaw SnapCopyText</strong><small>CAPTURE · OCR · COPIE</small></div><nav><button data-mode="region">Região</button><button data-mode="window">Janela</button><button data-mode="screen">Monitor</button></nav></header>
<main><section class="workspace"><div class="toolbar"><button id="ocr" disabled>Reconhecer texto</button><button id="copyImage" disabled>Copiar imagem</button><button id="save" disabled>Salvar PNG</button><span id="progress">Escolha um modo de captura.</span></div><div id="stage"><div id="sourceList"></div><canvas id="canvas"></canvas><div id="selection"></div></div><textarea id="text" placeholder="O texto reconhecido aparecerá aqui…"></textarea><button id="copyText">Copiar texto</button></section>
<aside><p class="eyebrow">HISTÓRICO LOCAL</p><div id="history"></div><small>Os últimos 100 textos ficam somente na memória enquanto o aplicativo está aberto.</small></aside></main>
<script src="renderer.js"></script></body></html>
