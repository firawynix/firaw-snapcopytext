server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # add_header dentro de uma location APAGA os de cima: location nova aqui
    # precisa repetir o bloco de segurança.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Depois do desafio da Cloudflare o navegador pode voltar com um POST na
    # mesma URL; site estático recusaria (405). Responde a página, como GET.
    error_page 405 =200 $uri;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
